<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Last Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.ibb.co/99Zx3m3j/In-Shot-20251019-191242317.jpg') center/cover no-repeat;
      filter: blur(6px) brightness(0.8);
      z-index: -1;
    }

    img {
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }

    p {
      color: #ff69b4;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      max-width: 80%;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <img src="https://i.ibb.co/KjBj2b99/d7fe21381791297043e1f7200db367fc.jpg" alt="Final Image">
  <p>
    I am waiting on telegram with this matching pfp, if you will be ready then match the pfp, 
    I will wait — this is just a gift cause we haven't changed our pfp from a long time.
  </p>
</body>
</html>
